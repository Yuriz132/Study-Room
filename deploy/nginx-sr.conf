# Study Room —— 子路径 /sr 部署片段
# 用法：将本文件内容加入站点 443 server 块内（与 /vs、站点根等共存于同一域名）。
# 前端已对 /sr 子路径自动适配（API 前缀 /sr/api、SPA basename=/sr、Socket.IO /sr/socket.io、
# 静态资源前缀），无需设置 VITE_API_BASE_URL。后端监听 3100。
# 注意：nginx 默认 include 的是 sites-enabled/ 下的文件；本片段需手动并入对应 server 块。

# 无尾斜杠 → 301 带斜杠
location = /sr { return 301 /sr/; }

# 带 hash 的静态资源：长期缓存（指纹变化自动刷新）
location /sr/assets/ {
    alias /opt/study-room/frontend/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA 前端 + HTML：不缓存，确保更新即时生效
location /sr/ {
    alias /opt/study-room/frontend/dist/;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /sr/index.html;
}

# 后端 API（去掉 /sr 前缀反代到 3100）
location /sr/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
}

# Socket.IO（WebSocket 升级，必须）
location /sr/socket.io/ {
    proxy_pass http://127.0.0.1:3100/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
