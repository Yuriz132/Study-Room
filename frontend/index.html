<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Room</title>
    <meta name="description" content="液态玻璃风格的英语学习室网站，支持浏览、闪卡、搜索与收藏。" />
    <meta name="author" content="Study Room" />
    <script>
      // 首屏前应用主题，避免闪烁（FOUC）。与 SettingsContext 的 theme 逻辑保持一致。
      (function () {
        try {
          var t = localStorage.getItem("liquid-words:theme") || "dark";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
          try { var sk = localStorage.getItem("liquid-words:skin"); if (sk && sk !== "default") r.classList.add(sk); } catch (e2) {}
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Patrick+Hand&display=swap" rel="stylesheet" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
